services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://booking:${POSTGRES_PASSWORD}@db:5432/booking
      RETELL_API_KEY: ${RETELL_API_KEY:?Set RETELL_API_KEY in .env}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_ADMIN_IDS: ${TG_ADMIN_IDS:-}
      FORWARD_RECORDINGS_TO_TELEGRAM: ${FORWARD_RECORDINGS_TO_TELEGRAM:-false}
      RETELL_RECORDING_HOSTS: ${RETELL_RECORDING_HOSTS:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres_data:
